services:
  hcygnus2mqtt:
    build: .
    container_name: hcygnus2mqtt
    restart: unless-stopped
    # le dossier contient config.yaml, dragino_plan.json et registers/
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./dragino_plan.json:/config/dragino_plan.json:ro
      - ./registers:/config/registers:ro
    # Uniquement pour transport: modbus (adaptateur USB-RS485) :
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
