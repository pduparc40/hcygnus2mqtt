# Copier en config.yaml et adapter.

# lorawan : PAC ── RS485 ── Dragino RS485W-LB ))) LoRaWAN ))) TTN/ChirpStack ── MQTT ── Home Assistant
# modbus  : liaison directe (adaptateur USB-RS485) — utile pour la découverte des registres
transport: lorawan

device:
  id: hcygnus171            # identifiant unique (topics, entités HA)
  name: PAC centrale
  model: HCygnus Tech 171
  unit: 1                   # adresse esclave Modbus de la PAC

# Liaison série côté PAC (sert à générer la configuration du Dragino)
serial:
  baudrate: 9600
  parity: N                 # N | E | O
  bytesize: 8
  stopbits: 1

lorawan:
  type: ttn                 # ttn | chirpstack
  application_id: mon-appli-pac
  device_id: dragino-pac    # TTN : ID de l'end device
  # dev_eui: a84041xxxxxxxxxx   # ChirpStack : DevEUI
  # tenant: ttn             # TTN : laisser "ttn" sur The Things Network public
  mqtt:                     # broker MQTT du serveur LoRaWAN
    host: eu1.cloud.thethings.network
    port: 8883              # TLS
    username: mon-appli-pac@ttn
    password: NNSXS.XXXXXXXX   # clé API TTN avec droit "Read application traffic" + "Write downlink"
  uplink_port: 2            # FPort des données d'interrogation du Dragino
  downlink_port: 2
  interval: 600             # secondes entre deux uplinks (AT+TDC)
  payver: 1                 # version de payload (AT+PAYVER), à incrémenter quand le plan change
  plan: dragino_plan.json   # généré par `hcygnus2mqtt dragino`
  reply_timeout_ms: 1000    # attente de la réponse de la PAC (AT+CMDDLx)

# Broker MQTT de Home Assistant (Mosquitto)
mqtt:
  host: 192.168.1.10
  port: 1883
  username: hcygnus
  password: change-moi
  base_topic: hcygnus2mqtt

registers: registers/hcygnus_tech.yaml

options:
  include_unverified: true  # interroge aussi les registres devinés (catégorie "diagnostic" dans HA)
  allow_writes: false       # ⚠️ laisser à false tant que la table n'est pas vérifiée
  allow_unverified_writes: false
  # only: [water_in_temp, water_out_temp, outdoor_temp]
  # exclude: [high_pressure]

# --- uniquement pour transport: modbus --------------------------------------
modbus:
  type: rtu
  port: /dev/ttyUSB0
  baudrate: 9600
  parity: N
  timeout: 1.0
